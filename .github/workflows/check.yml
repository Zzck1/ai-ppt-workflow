name: Workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/check_workflow.py plan examples/course-report.plan.json
      - run: python -m unittest discover -s tests -v
